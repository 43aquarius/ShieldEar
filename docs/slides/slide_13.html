<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>声盾 · 结尾</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="global.css">
<style>
  html, body { width: 1280px; height: 720px; overflow: hidden; }
</style>
</head>
<body>
<div class="slide">

  <!-- 主体：非对称，重心偏左下 -->
  <div class="absolute left-20 top-[186px]">
    <p style="font-size:14px; color:var(--muted); letter-spacing:.5em;">SHIELDEAR</p>
    <p class="serif" style="margin-top:30px; font-size:52px; font-weight:900; line-height:1.5;">
      下一次接到「熟人」来电，<br>希望几秒钟后，你手里<br>能有一个<span class="accent">可以相信的答案</span>。
    </p>
  </div>

  <!-- 右上：真实证据锚点（案件号，非装饰） -->
  <div class="absolute right-20 top-[150px] text-right">
    <p class="num" style="font-size:11px; color:var(--muted); letter-spacing:.18em;">案例库 · 随时可查</p>
    <p class="num" style="margin-top:8px; font-size:19px; font-weight:500; color:var(--secondary);">SS-20261028-0003</p>
    <p style="margin-top:8px; font-size:12px; color:var(--muted); line-height:1.7;">现场合成 · 当场检出 · 双哈希入库<br>答辩中生成的每一件证据都可复核</p>
  </div>

  <!-- 右下：一行事实性小字（替代三个胶囊按钮） -->
  <div class="absolute right-20 bottom-[150px] text-right">
    <p style="font-size:13.5px; color:var(--secondary); line-height:2.1;">
      现场演示就绪 · 评审可任意出题<br>
      证据链与案件库可当场复核<br>
      引擎与测试代码随作品提交
    </p>
  </div>

  <!-- 底部压舱 -->
  <div class="absolute left-20 right-20 bottom-12">
    <div class="hairline" style="padding-top:18px; display:flex; justify-content:space-between; align-items:baseline;">
      <p style="font-size:14.5px; color:var(--primary);">谢谢聆听，恳请各位评委批评指正</p>
      <p style="font-size:13px; color:var(--muted);">【团队名称】 · 大连理工大学 · <span class="num">2026.10</span></p>
    </div>
  </div>
</div>

<aside data-notes class="hidden" style="display:none;">
  <ul>
    <li>结尾语放慢：下一次接到熟人来电，希望几秒钟后你能有一个可以相信的答案。</li>
    <li>口头补一句：演示环节现在就可以开始，欢迎出题。</li>
    <li>致谢简短，把时间留给演示与问答。</li>
  </ul>
</aside>
</body>
</html>
